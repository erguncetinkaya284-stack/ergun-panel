<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎨 Tasarım Programları Öğreniyorum - Ergün Panel</title>
    <link rel="stylesheet" href="shared.css">
    <link rel="stylesheet" href="tasarim.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
    <header>
        <div class="logo-area">
            <h1><a href="index.html" style="color:inherit; text-decoration:none;">← Ergün Panel</a></h1>
            <div class="badge-time">🎨 Tasarım Programları Öğreniyorum</div>
        </div>
        <div class="quick-stats">
            <button class="btn-action" onclick="exportAllData()" title="Tüm verileri .json dosyası olarak indir">📤 Dışa Aktar</button>
            <button class="btn-action" onclick="document.getElementById('import-file-input').click()" title="Daha önce indirdiğin .json dosyasını yükle">📥 İçe Aktar</button>
            <input type="file" id="import-file-input" accept="application/json,.json" style="display:none;" onchange="importAllData(this.files[0])">
        </div>
    </header>

    <main>
<div class="module-box" id="module-tasarim">
            <div class="module-header">
                <h2><span class="toggle-arrow" onclick="toggleModule(this)">▶</span>🎨 Tasarım Programları Öğreniyorum</h2>
                <span style="font-size:0.8rem; color:var(--text-muted);" id="tasarim-count">0 kayıt</span>
            </div>

            <!-- Kategori yönetimi -->
            <div class="form-row">
                <input type="text" id="new-tasarim-cat" placeholder="Örn: Photoshop, AutoCAD, Illustrator...">
                <button class="btn-action btn-primary" onclick="addTasarimCategory('program')">+ Program Ekle</button>
            </div>
            <div class="category-tags" id="tasarim-program-list"></div>

            <div class="form-row">
                <input type="text" id="new-tasarim-topic" placeholder="Örn: Katmanlar, Çizim Komutları, Render...">
                <button class="btn-action btn-primary" onclick="addTasarimCategory('topic')">+ Konu Ekle</button>
            </div>
            <div class="category-tags" id="tasarim-topic-list"></div>

            <!-- Ders ekleme formu -->
            <div class="recipe-form">
                <input type="text" id="tasarim-title" placeholder="Başlık (örn: Layer/Katman Kullanımı)">
                <textarea id="tasarim-content" placeholder="Ders içeriği — o anki yaptığın dersi buraya kopyalayabilirsin..."></textarea>
                <input type="text" id="tasarim-youtube" placeholder="YouTube linki (opsiyonel)">
                <div class="form-row">
                    <select id="tasarim-program-cat"></select>
                    <select id="tasarim-topic-cat"></select>
                </div>
                <button class="btn-action btn-primary" id="tasarim-save-btn" onclick="saveTasarimItem()">Kaydet</button>
            </div>

            <!-- Kayıt listesi -->
            <div class="recipe-list" id="tasarim-list"></div>
        </div>
    </main>

    <script src="shared.js"></script>
    <script src="tasarim.js"></script>
    <script>
        function renderModule() {
            renderTasarim()
        }

        window.onload = function() {
            renderModule();
            loadAllData()
                .then(function() { renderModule(); })
                .catch(function(e) { /* veri yüklenemese bile uygulama boş durumda çalışmaya devam eder */ })
                .finally(function() { loadModuleStates(); });
        };
    </script>
</body>
</html>
