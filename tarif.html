<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👨‍🍳 Tarif Defteri - Ergün Panel</title>
    <link rel="stylesheet" href="shared.css">
    <link rel="stylesheet" href="tarif.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
    <header>
        <div class="logo-area">
            <h1><a href="index.html" style="color:inherit; text-decoration:none;">← Ergün Panel</a></h1>
            <div class="badge-time">👨‍🍳 Tarif Defteri</div>
        </div>
        <div class="quick-stats">
            <button class="btn-action" onclick="exportAllData()" title="Tüm verileri .json dosyası olarak indir">📤 Dışa Aktar</button>
            <button class="btn-action" onclick="document.getElementById('import-file-input').click()" title="Daha önce indirdiğin .json dosyasını yükle">📥 İçe Aktar</button>
            <input type="file" id="import-file-input" accept="application/json,.json" style="display:none;" onchange="importAllData(this.files[0])">
        </div>
    </header>

    <main>
<div class="module-box" id="module-tarif">
            <div class="module-header">
                <h2><span class="toggle-arrow" onclick="toggleModule(this)">▶</span>👨‍🍳 Tarif Defteri</h2>
                <span style="font-size:0.8rem; color:var(--text-muted);" id="recipe-count">0 tarif</span>
            </div>

            <!-- Kategori yönetimi -->
            <div class="form-row">
                <input type="text" id="new-time-cat" placeholder="Örn: Sabah, Öğle...">
                <button class="btn-action btn-primary" onclick="addCategory('time')">+ Zaman Kategorisi Ekle</button>
            </div>
            <div class="category-tags" id="time-categories-list"></div>

            <div class="form-row">
                <input type="text" id="new-type-cat" placeholder="Örn: Yiyecek, İçecek...">
                <button class="btn-action btn-primary" onclick="addCategory('type')">+ Tür Kategorisi Ekle</button>
            </div>
            <div class="category-tags" id="type-categories-list"></div>

            <!-- Tarif ekleme formu -->
            <div class="recipe-form">
                <input type="text" id="recipe-title" placeholder="Tarif başlığı">
                <textarea id="recipe-content" placeholder="Tarifin içeriği (malzemeler, yapılışı...)"></textarea>
                <input type="text" id="recipe-youtube" placeholder="YouTube linki (opsiyonel)">
                <div class="form-row">
                    <select id="recipe-time-cat"></select>
                    <select id="recipe-type-cat"></select>
                </div>
                <button class="btn-action btn-primary" id="recipe-save-btn" onclick="saveRecipe()">Kaydet</button>
            </div>

            <!-- Tarif listesi -->
            <div class="recipe-list" id="recipes-list"></div>
        </div>
    </main>

    <script src="shared.js"></script>
    <script src="tarif.js"></script>
    <script>
        function renderModule() {
            renderCategories()
            renderCategoryOptions()
            renderRecipes()
        }

        window.onload = function() {
            renderModule();
            loadAllData()
                .then(function() { renderModule(); })
                .catch(function(e) { /* veri yüklenemese bile uygulama boş durumda çalışmaya devam eder */ })
                .finally(function() { loadModuleStates(); });
        };
    </script>
</body>
</html>
