<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌍 Yabancı Dil Takibi - Ergün Panel</title>
    <link rel="stylesheet" href="shared.css">
    <link rel="stylesheet" href="dil.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
    <header>
        <div class="logo-area">
            <h1><a href="index.html" style="color:inherit; text-decoration:none;">← Ergün Panel</a></h1>
            <div class="badge-time">🌍 Yabancı Dil Takibi</div>
        </div>
        <div class="quick-stats">
            <button class="btn-action" onclick="exportAllData()" title="Tüm verileri .json dosyası olarak indir">📤 Dışa Aktar</button>
            <button class="btn-action" onclick="document.getElementById('import-file-input').click()" title="Daha önce indirdiğin .json dosyasını yükle">📥 İçe Aktar</button>
            <input type="file" id="import-file-input" accept="application/json,.json" style="display:none;" onchange="importAllData(this.files[0])">
        </div>
    </header>

    <main>
<div class="module-box" id="module-dil">
            <div class="module-header">
                <h2><span class="toggle-arrow" onclick="toggleModule(this)">▶</span>🌍 Yabancı Dil Takibi</h2>
                <span style="font-size:0.8rem; color:var(--text-muted);" id="lang-count">0 kayıt</span>
            </div>

            <!-- Kategori yönetimi -->
            <div class="form-row">
                <input type="text" id="new-lang-cat" placeholder="Örn: İngilizce, Almanca...">
                <button class="btn-action btn-primary" onclick="addLangCategory('lang')">+ Dil Kategorisi Ekle</button>
            </div>
            <div class="category-tags" id="lang-categories-list"></div>

            <div class="form-row">
                <input type="text" id="new-topic-cat" placeholder="Örn: Rakamlar, Sayılar...">
                <button class="btn-action btn-primary" onclick="addLangCategory('topic')">+ Konu Kategorisi Ekle</button>
            </div>
            <div class="category-tags" id="topic-categories-list"></div>

            <!-- Kayıt ekleme formu -->
            <div class="recipe-form">
                <input type="text" id="lang-title" placeholder="Başlık">
                <textarea id="lang-content" placeholder="İçerik (kelimeler, örnek cümleler, açıklama...)"></textarea>
                <input type="text" id="lang-youtube" placeholder="YouTube linki (opsiyonel)">
                <div class="form-row">
                    <select id="lang-lang-cat"></select>
                    <select id="lang-topic-cat"></select>
                </div>
                <button class="btn-action btn-primary" id="lang-save-btn" onclick="saveLangItem()">Kaydet</button>
            </div>

            <!-- Kayıt listesi -->
            <div class="recipe-list" id="lang-list"></div>
        </div>
    </main>

    <script src="shared.js"></script>
    <script src="dil.js"></script>
    <script>
        function renderModule() {
            renderLangCategories()
            renderLangCategoryOptions()
            renderLangItems()
        }

        window.onload = function() {
            renderModule();
            loadAllData()
                .then(function() { renderModule(); })
                .catch(function(e) { /* veri yüklenemese bile uygulama boş durumda çalışmaya devam eder */ })
                .finally(function() { loadModuleStates(); });
        };
    </script>
</body>
</html>
