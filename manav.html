<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🥬 Manav Stok ve Satış Takibi - Ergün Panel</title>
    <link rel="stylesheet" href="shared.css">
    <link rel="stylesheet" href="manav.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
    <header>
        <div class="logo-area">
            <h1><a href="index.html" style="color:inherit; text-decoration:none;">← Ergün Panel</a></h1>
            <div class="badge-time">🥬 Manav Stok ve Satış Takibi</div>
        </div>
        <div class="quick-stats">
            <button class="btn-action" onclick="exportAllData()" title="Tüm verileri .json dosyası olarak indir">📤 Dışa Aktar</button>
            <button class="btn-action" onclick="document.getElementById('import-file-input').click()" title="Daha önce indirdiğin .json dosyasını yükle">📥 İçe Aktar</button>
            <input type="file" id="import-file-input" accept="application/json,.json" style="display:none;" onchange="importAllData(this.files[0])">
        </div>
    </header>

    <main>
<div class="module-box" id="module-manav">
            <div class="module-header">
                <h2><span class="toggle-arrow" onclick="toggleModule(this)">▶</span>🥬 Manav Stok ve Satış Takibi</h2>
                <span style="font-size:0.8rem; color:var(--text-muted);" id="manav-count">0 kg stok</span>
            </div>

            <!-- Ürün türü yönetimi -->
            <div class="form-row">
                <input type="text" id="new-manav-type" placeholder="Örn: Domates, Salatalık, Elma, Muz...">
                <button class="btn-action btn-primary" onclick="addManavType()">+ Ürün Türü Ekle</button>
            </div>
            <div class="category-tags" id="manav-type-list"></div>

            <!-- Fiyat belirleme -->
            <h3 style="margin:14px 0 6px 0; font-size:0.9rem; color:var(--text-muted);">Fiyat Belirleme (₺/kg)</h3>
            <div class="form-row">
                <select id="manav-price-type"></select>
                <input type="text" id="manav-price-value" placeholder="Fiyat (₺/kg)">
                <button class="btn-action btn-primary" onclick="setManavPrice()">Fiyat Güncelle</button>
            </div>

            <!-- Stok girişi -->
            <h3 style="margin:14px 0 6px 0; font-size:0.9rem; color:var(--text-muted);">Stok Girişi (Alım)</h3>
            <div class="recipe-form">
                <div class="form-row">
                    <select id="manav-stock-type"></select>
                    <input type="text" id="manav-stock-kg" placeholder="Kg">
                </div>
                <button class="btn-action btn-primary" onclick="addManavStock()">+ Stok Ekle</button>
            </div>

            <!-- Satış girişi -->
            <h3 style="margin:14px 0 6px 0; font-size:0.9rem; color:var(--text-muted);">Müşteri Satışı</h3>
            <div class="recipe-form">
                <div class="form-row">
                    <select id="manav-sale-type"></select>
                    <input type="text" id="manav-sale-customer" placeholder="Müşteri adı">
                </div>
                <div class="form-row">
                    <input type="text" id="manav-sale-kg" placeholder="Satılan kg">
                </div>
                <button class="btn-action btn-primary" onclick="addManavSale()">Satış Ekle</button>
            </div>

            <!-- Tür bazlı özet -->
            <h3 style="margin:14px 0 6px 0; font-size:0.9rem; color:var(--text-muted);">Tür Bazlı Durum</h3>
            <div id="manav-type-summary"></div>

            <!-- Son satışlar -->
            <h3 style="margin:14px 0 6px 0; font-size:0.9rem; color:var(--text-muted);">Son Satışlar</h3>
            <div id="manav-sales-list" style="display:flex; flex-direction:column; gap:8px;"></div>

            <!-- Genel toplam -->
            <div style="margin-top:14px; padding-top:10px; border-top:1px solid var(--border-color); font-weight:600;" id="manav-total">
                Toplam Stok: 0 kg — Toplam Satış: 0 kg
            </div>
        </div>
    </main>

    <script src="shared.js"></script>
    <script src="manav.js"></script>
    <script>
        function renderModule() {
            renderManav()
        }

        window.onload = function() {
            renderModule();
            loadAllData()
                .then(function() { renderModule(); })
                .catch(function(e) { /* veri yüklenemese bile uygulama boş durumda çalışmaya devam eder */ })
                .finally(function() { loadModuleStates(); });
        };
    </script>
</body>
</html>
