<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎸 Enstrüman & Ders Takibi - Ergün Panel</title>
    <link rel="stylesheet" href="shared.css">
    <link rel="stylesheet" href="enstruman.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
    <header>
        <div class="logo-area">
            <h1><a href="index.html" style="color:inherit; text-decoration:none;">← Ergün Panel</a></h1>
            <div class="badge-time">🎸 Enstrüman & Ders Takibi</div>
        </div>
        <div class="quick-stats">
            <button class="btn-action" onclick="exportAllData()" title="Tüm verileri .json dosyası olarak indir">📤 Dışa Aktar</button>
            <button class="btn-action" onclick="document.getElementById('import-file-input').click()" title="Daha önce indirdiğin .json dosyasını yükle">📥 İçe Aktar</button>
            <input type="file" id="import-file-input" accept="application/json,.json" style="display:none;" onchange="importAllData(this.files[0])">
        </div>
    </header>

    <main>
<div class="module-box" id="module-enstruman">
            <div class="module-header">
                <h2><span class="toggle-arrow" onclick="toggleModule(this)">▶</span>🎸 Enstrüman & Ders Takibi</h2>
                <span style="font-size:0.8rem; color:var(--text-muted);" id="instrument-count">0 kayıt</span>
            </div>

            <!-- Kategori yönetimi -->
            <div class="form-row">
                <input type="text" id="new-instrument-cat" placeholder="Örn: Gitar, Piyano...">
                <button class="btn-action btn-primary" onclick="addInstrumentCategory('instrument')">+ Enstrüman Ekle</button>
            </div>
            <div class="category-tags" id="instrument-categories-list"></div>

            <div class="form-row">
                <input type="text" id="new-lesson-cat" placeholder="Örn: Teknik, Teori, Eser...">
                <button class="btn-action btn-primary" onclick="addInstrumentCategory('lesson')">+ Ders Ekle</button>
            </div>
            <div class="category-tags" id="lesson-categories-list"></div>

            <!-- Kayıt ekleme formu -->
            <div class="recipe-form">
                <input type="text" id="instrument-title" placeholder="Eser ismi / başlık">
                <textarea id="instrument-content" placeholder="İçerik detayları (notalar, akorlar, notlar...)"></textarea>
                <input type="text" id="instrument-youtube" placeholder="YouTube linki (opsiyonel)">
                <div class="form-row">
                    <select id="instrument-instrument-cat"></select>
                    <select id="instrument-lesson-cat"></select>
                </div>
                <button class="btn-action btn-primary" id="instrument-save-btn" onclick="saveInstrumentItem()">Kaydet</button>
            </div>

            <!-- Kayıt listesi -->
            <div class="recipe-list" id="instrument-list"></div>
        </div>
    </main>

    <script src="shared.js"></script>
    <script src="enstruman.js"></script>
    <script>
        function renderModule() {
            renderInstrumentCategories()
            renderInstrumentCategoryOptions()
            renderInstrumentItems()
        }

        window.onload = function() {
            renderModule();
            loadAllData()
                .then(function() { renderModule(); })
                .catch(function(e) { /* veri yüklenemese bile uygulama boş durumda çalışmaya devam eder */ })
                .finally(function() { loadModuleStates(); });
        };
    </script>
</body>
</html>
