<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 KPSS Takibi - Ergün Panel</title>
    <link rel="stylesheet" href="shared.css">
    <link rel="stylesheet" href="kpss.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
    <header>
        <div class="logo-area">
            <h1><a href="index.html" style="color:inherit; text-decoration:none;">← Ergün Panel</a></h1>
            <div class="badge-time">📚 KPSS Takibi</div>
        </div>
        <div class="quick-stats">
            <button class="btn-action" onclick="exportAllData()" title="Tüm verileri .json dosyası olarak indir">📤 Dışa Aktar</button>
            <button class="btn-action" onclick="document.getElementById('import-file-input').click()" title="Daha önce indirdiğin .json dosyasını yükle">📥 İçe Aktar</button>
            <input type="file" id="import-file-input" accept="application/json,.json" style="display:none;" onchange="importAllData(this.files[0])">
        </div>
    </header>

    <main>
<div class="module-box" id="module-kpss">
            <div class="module-header">
                <h2><span class="toggle-arrow" onclick="toggleModule(this)">▶</span>📚 KPSS Takibi</h2>
                <span style="font-size:0.8rem; color:var(--text-muted);" id="kpss-count">0 ders</span>
            </div>

            <div class="form-row">
                <input type="text" id="new-kpss-subject" placeholder="Ders adı (örn: Matematik)">
                <button class="btn-action btn-primary" onclick="addKpssSubject()">+ Ders Ekle</button>
            </div>

            <div id="kpss-subjects-list" style="display:flex; flex-direction:column; gap:12px; margin-top:10px;"></div>
        </div>
    </main>

    <script src="shared.js"></script>
    <script src="kpss.js"></script>
    <script>
        function renderModule() {
            renderKpss()
        }

        window.onload = function() {
            renderModule();
            loadAllData()
                .then(function() { renderModule(); })
                .catch(function(e) { /* veri yüklenemese bile uygulama boş durumda çalışmaya devam eder */ })
                .finally(function() { loadModuleStates(); });
        };
    </script>
</body>
</html>
