<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏠 Gayrimenkul Takibi (500 Ev / 500 Dükkan) - Ergün Panel</title>
    <link rel="stylesheet" href="shared.css">
    <link rel="stylesheet" href="gayrimenkul.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
    <header>
        <div class="logo-area">
            <h1><a href="index.html" style="color:inherit; text-decoration:none;">← Ergün Panel</a></h1>
            <div class="badge-time">🏠 Gayrimenkul Takibi (500 Ev / 500 Dükkan)</div>
        </div>
        <div class="quick-stats">
            <button class="btn-action" onclick="exportAllData()" title="Tüm verileri .json dosyası olarak indir">📤 Dışa Aktar</button>
            <button class="btn-action" onclick="document.getElementById('import-file-input').click()" title="Daha önce indirdiğin .json dosyasını yükle">📥 İçe Aktar</button>
            <input type="file" id="import-file-input" accept="application/json,.json" style="display:none;" onchange="importAllData(this.files[0])">
        </div>
    </header>

    <main>
<div class="module-box" id="module-gayrimenkul">
            <div class="module-header">
                <h2><span class="toggle-arrow" onclick="toggleModule(this)">▶</span>🏠 Gayrimenkul Takibi (500 Ev / 500 Dükkan)</h2>
                <span style="font-size:0.8rem; color:var(--text-muted);">Birim Kira: 30.000 ₺</span>
            </div>
            <table class="excel-table">
                <thead>
                    <tr>
                        <th>Kategori</th>
                        <th>Dolu / Aktif</th>
                        <th>Aylık Potansiyel Gelir</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Konutlar</td>
                        <td>
                            <div class="counter-group">
                                <button class="btn-ctrl btn-minus" onclick="updateRealEstate(this, -1, 30000)">-</button>
                                <span class="counter-value" id="ev-dolu">0</span>
                                <button class="btn-ctrl btn-plus" onclick="updateRealEstate(this, 1, 30000)">+</button>
                            </div>
                        </td>
                        <td id="ev-gelir">0 ₺</td>
                    </tr>
                    <tr>
                        <td>Dükkanlar</td>
                        <td>
                            <div class="counter-group">
                                <button class="btn-ctrl btn-minus" onclick="updateRealEstate(this, -1, 30000)">-</button>
                                <span class="counter-value" id="dukkan-dolu">0</span>
                                <button class="btn-ctrl btn-plus" onclick="updateRealEstate(this, 1, 30000)">+</button>
                            </div>
                        </td>
                        <td id="dukkan-gelir">0 ₺</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="shared.js"></script>
    <script src="gayrimenkul.js"></script>
    <script>
        function renderModule() {
            renderGayrimenkul()
        }

        window.onload = function() {
            renderModule();
            loadAllData()
                .then(function() { renderModule(); })
                .catch(function(e) { /* veri yüklenemese bile uygulama boş durumda çalışmaya devam eder */ })
                .finally(function() { loadModuleStates(); });
        };
    </script>
</body>
</html>
