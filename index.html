<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ergün - Entegre Yaşam ve İşletme Paneli</title>
    <link rel="stylesheet" href="shared.css">
    <link rel="stylesheet" href="index.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

    <header>
        <div class="logo-area">
            <h1>Ergün • Entegre Komuta Merkezi</h1>
            <div class="badge-time">⏰ Sabah 05:00 Sabit Kalkış</div>
        </div>
        <div class="search-area">
            <input type="text" id="global-search" placeholder="🔍 Modüllerde ara..." oninput="filterModules()">
        </div>
        <div class="quick-stats">
            <button class="btn-action" onclick="toggleAdminPanel()" title="Modüllerin görünürlüğünü ve sırasını ayarla">⚙️ Yönetici</button>
            <button class="btn-action" onclick="exportAllData()" title="Tüm verileri .json dosyası olarak indir">📤 Dışa Aktar</button>
            <button class="btn-action" onclick="document.getElementById('import-file-input').click()" title="Daha önce indirdiğin .json dosyasını yükle">📥 İçe Aktar</button>
            <input type="file" id="import-file-input" accept="application/json,.json" style="display:none;" onchange="importAllData(this.files[0])">
        </div>
    </header>

    <div class="admin-panel hidden" id="admin-panel">
        <div id="admin-panel-content"></div>
    </div>

    <div class="quote-banner" id="quote-banner"></div>

    <main>
        <div class="nav-grid" id="nav-grid"></div>
    </main>

    <script src="shared.js"></script>
    <script src="index.js"></script>
</body>
</html>
